name: Build & Package iOS App (CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub Actions

jobs:
  build-ios:
    name: Build iOS IPA & Quality Gate
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis (Quality Gate)
        run: flutter analyze

      - name: Run Automated Widget Tests
        run: flutter test

      - name: Build iOS App (Release, No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: Package App into Sideloadable IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r TaskFlow-iOS-unsigned.ipa Payload
          echo "Đã đóng gói thành công TaskFlow-iOS-unsigned.ipa!"

      - name: Upload IPA Artifact for Windows Download
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-iOS-unsigned
          path: TaskFlow-iOS-unsigned.ipa
          retention-days: 14
